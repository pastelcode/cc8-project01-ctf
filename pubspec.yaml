name: capture_the_flag
description: "Capture The Flag game implementation for CC8 at Galileo University"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.2.1
  forui: ^0.24.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  logger: ^2.7.0
  riverpod_annotation: 4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
flutter:
  uses-material-design: true
  fonts:
    - family: DepartureMono
      fonts:
        - asset: assets/fonts/DepartureMono-Regular.otf
